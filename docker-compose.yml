services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staff_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunludur}
      POSTGRES_DB: ${POSTGRES_DB:-staff_housing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [staff_housing_net]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-staff_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-staff_housing}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunludur}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET zorunludur}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY zorunludur}
      COOKIE_NAME: ${COOKIE_NAME:-staff_session}
      COOKIE_MAX_AGE_DAYS: ${COOKIE_MAX_AGE_DAYS:-1}
      CLIENT_URL: ${CLIENT_URL:-http://169.58.124.2:3335}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://169.58.124.2:3335}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-500}
      VISITOR_EXPORT_MAX_ROWS: ${VISITOR_EXPORT_MAX_ROWS:-5000}
      ROOM_OCCUPANCY_EXPORT_MAX_ROWS: ${ROOM_OCCUPANCY_EXPORT_MAX_ROWS:-10000}
      ROOM_INVENTORY_EXPORT_MAX_ROWS: ${ROOM_INVENTORY_EXPORT_MAX_ROWS:-10000}
      MAINTENANCE_EXPORT_MAX_ROWS: ${MAINTENANCE_EXPORT_MAX_ROWS:-10000}
      STOCK_EXPORT_MAX_ROWS: ${STOCK_EXPORT_MAX_ROWS:-10000}
      STOCK_OVERVIEW_MAX_ITEMS: ${STOCK_OVERVIEW_MAX_ITEMS:-5000}
      EMPLOYEE_LIST_MAX_ROWS: ${EMPLOYEE_LIST_MAX_ROWS:-5000}
      EMPLOYEE_EXPORT_MAX_ROWS: ${EMPLOYEE_EXPORT_MAX_ROWS:-10000}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY zorunludur}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY zorunludur}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [staff_housing_net]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3335}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [staff_housing_net]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=16m
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s

networks:
  staff_housing_net:

volumes:
  postgres_data:
